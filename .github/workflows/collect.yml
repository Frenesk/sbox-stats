name: collect

# Сбор метрик S&Box каждые 10 минут. Результат — ветка `data` (одна коммит-версия, история не растёт),
# откуда его раздают GitHub Pages, jsDelivr и raw.githubusercontent.com.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Только эти источники (через запятую), пусто = по расписанию'
        required: false
      force:
        description: 'Обновить все источники принудительно'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: date +%s > /tmp/t0
      - uses: actions/checkout@v4

      - name: Прошлые данные (ветка data)
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git --work-tree=out checkout origin/data -- .
            git reset -q
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Кэш браузера Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - name: Сбор
        run: |
          ARGS="--out=out"
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only=${{ github.event.inputs.only }}"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node src/collect.mjs $ARGS

      - name: Публикация в ветку data
        run: |
          cd out
          git init -q -b data
          git config user.name "sbox-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Сброс кэша jsDelivr
        continue-on-error: true
        run: |
          for f in manifest.json live.json analytics.json; do
            curl -s -m 10 "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/$f" >/dev/null || true
          done

      # Расписание GitHub (cron) для этого репозитория срабатывает ненадёжно, поэтому каждый запуск сам
      # ставит следующий примерно через 10 минут после своего начала. Группа concurrency держит не больше
      # одного ожидающего запуска, поэтому цепочки не размножаются.
      - name: Следующий запуск через ~10 минут
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T0=$(cat /tmp/t0 2>/dev/null || date +%s)
          WAIT=$(( 570 - ($(date +%s) - T0) ))
          if [ $WAIT -gt 0 ]; then sleep $WAIT; fi
          PENDING=$(gh run list -R ${{ github.repository }} --workflow collect.yml --json status -q '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "${PENDING:-0}" = "0" ]; then gh workflow run collect.yml -R ${{ github.repository }} --ref main; else echo "уже есть ожидающий запуск"; fi
